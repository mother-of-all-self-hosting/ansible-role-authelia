---
# Credentials of the throwaway user that this scenario authenticates as.
#
# They live in this file rather than in `molecule.yml`, because Molecule
# expands anything that looks like an environment variable in `molecule.yml`,
# and an argon2id hash is full of dollar signs. `converge.yml` and `verify.yml`
# read this file with `include_vars`, which interpolates nothing.
#
# The hash below is the argon2id digest of `authelia_molecule_password`,
# produced with the same Authelia release the role installs:
#
#   docker run --rm --entrypoint /app/authelia \
#     ghcr.io/authelia/authelia:4.37.5 hash-password 'molecule-test-password'

authelia_molecule_username: molecule
authelia_molecule_password: molecule-test-password
authelia_molecule_password_hash: '$argon2id$v=19$m=65536,t=3,p=4$TjM+I2HT7rHyRDUrepct2w$E9wlifoFJeXDobDN6c/bQXunSXliGhE3+gZmaBUYIU4'

# Enabling the file-based authentication backend is what makes the role write
# a user database and point Authelia's configuration at it.
authelia_config_authentication_backend_file_content: |
  users:
    {{ authelia_molecule_username }}:
      displayname: Molecule Test User
      password: {{ authelia_molecule_password_hash | to_json }}
      email: {{ authelia_molecule_username }}@example.com
      groups:
        - admins
