---
- name: Check existence of Authelia systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ authelia_identifier }}.service"
  register: authelia_service_stat

- name: Uninstall Authelia systemd services and files
  when: authelia_service_stat.stat.exists | bool
  block:
    - name: Ensure Authelia systemd service is stopped
      ansible.builtin.service:
        name: "{{ authelia_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Authelia systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ authelia_identifier }}.service"
        state: absent

    - name: Ensure Authelia support files do not exist
      ansible.builtin.file:
        path: "{{ authelia_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure Authelia local config path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ authelia_config_path }}"
      register: authelia_config_path_deletion_result
      changed_when: authelia_config_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Authelia local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ authelia_data_path }}"
      register: authelia_data_path_deletion_result
      changed_when: authelia_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Authelia base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ authelia_base_path }}"
      register: authelia_base_path_deletion_result
      changed_when: authelia_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Authelia container network does not exist
      when: authelia_container_network_deletion_enabled
      block:
        - name: Ensure Authelia container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ authelia_container_network }}"
            state: absent
          register: authelia_network_deletion_result

        - name: Ensure Authelia container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ authelia_container_network }}
          register: authelia_network_deletion_result
          changed_when: authelia_container_network in authelia_network_deletion_result.stdout

- name: Check existence of Authelia local config path
  ansible.builtin.stat:
    path: "{{ authelia_config_path }}"
  register: authelia_config_path_stat

# We just want to notify the user. Deleting config is too destructive.
- name: Inject the message about the remaining Authelia local config path
  when: authelia_config_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local Authelia instance has been removed, some old config remains in `" + authelia_config_path + "`. Feel free to delete it."
        ]
      }}

- name: Check existence of Authelia local data path
  ansible.builtin.stat:
    path: "{{ authelia_data_path }}"
  register: authelia_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining Authelia local data path
  when: authelia_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local Authelia instance has been removed, some old data remains in `" + authelia_data_path + "`. Feel free to delete it."
        ]
      }}
